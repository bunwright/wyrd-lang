name: Bōcland

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Starlight timbrian
    runs-on: ubuntu-latest
    steps:
      - name: Fruman nim
        uses: actions/checkout@v6
      - name: Bōcland timbre
        uses: withastro/action@v6
        with:
          path: site

  deploy:
    name: GitHub Pages gecȳþan
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Bōcland gecȳþ
        id: deployment
        uses: actions/deploy-pages@v5
